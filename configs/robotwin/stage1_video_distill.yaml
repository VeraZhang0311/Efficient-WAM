system: stage1_video_distill
name: stage1
max_steps: 80000
per_device_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
weight_decay: 1.0e-3
min_lr_ratio: 0.001
warmup_steps: 1000
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
checkpoint_dir: checkpoints
log_interval: 10
checkpoint_interval: 40000
checkpoint_total_limit: 10
report_to: tensorboard
resume_from: ""

performance:
  reuse_condition_latent_from_clean: true
  verify_condition_latent_reuse: false

dataset:
  root: /path/to/efficient_wam_train_dataset

teacher:
  mode: distill
  checkpoint_path: /path/to/Wan2.2-TI2V-5B
  config_path: /path/to/Wan2.2-TI2V-5B
  vae_path: /path/to/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
  load_vae: false
  precision: bfloat16
  pca_stats_path: /path/to/stage1_pca_stats.pt

student:
  checkpoint_path: /path/to/Wan2.2-TI2V-5B
  config_path: /path/to/Wan2.2-TI2V-5B
  vae_path: /path/to/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
  precision: bfloat16
  dim: 2048
  ffn_dim: 8192
  num_heads: 16
  num_layers: 12
  head_dim: 128
  future_video_size: [192, 160]
  hidden_anchor_layers: [1, 3, 5, 7, 9, 12]
  motion_anchor_layers: [6, 8, 10, 12]
  teacher_layer_mapping: [1, 2, 4, 6, 8, 11, 14, 17, 20, 23, 26, 30]

distill:
  projection_dim: 256
  hidden_teacher_layers: [1, 4, 8, 14, 20, 30]
  motion_teacher_layers: [11, 17, 23, 30]
  lambda_gt: 1.0
  lambda_hidden_schedule: [0.2, 0.1, 0.0]
  lambda_motion_schedule: [0.2, 0.1, 0.0]
  lambda_velocity_schedule: [0.0, 0.0, 0.0]
  schedule_boundaries: [0.35, 0.75, 1.0]
  timestep_sampler:
    type: sigma_aware
    uniform_weight: 0.25
    low_center: 0.25
    low_weight: 1.0
    mid_center: 0.50
    mid_weight: 1.25
    high_center: 0.75
    high_weight: 0.75
    width: 0.22
  sigma_loss_weights:
    gt:
      mode: low_mid
      max_sigma: 0.75
      softness: 0.12
      floor: 0.25
    hidden:
      mode: mid
      center: 0.50
      width: 0.25
      floor: 0.20
    motion:
      mode: mid
      center: 0.50
      width: 0.30
      floor: 0.20
    velocity:
      mode: mid_high
      min_sigma: 0.25
      softness: 0.12
      floor: 0.20
