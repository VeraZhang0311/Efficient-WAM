# Efficient-WAM Stage 1 PCA-statistics preparation config.
#
# This config collects teacher hidden-state statistics used by the compact
# video expert distillation heads.

system: stage1_pca_prep
name: stage1_pca_prep

dataset:
  name: robotwin
  root: /path/to/converted_robotwin
  task_mode: multi
  task_name: null
  data_mode: both
  num_video_frames: 8
  global_downsample_rate: 3
  video_action_freq_ratio: 2
  video_size: [384, 320]
  future_video_size: [192, 160]

teacher:
  checkpoint_path: /path/to/Wan2.2-TI2V-5B
  config_path: /path/to/Wan2.2-TI2V-5B
  vae_path: /path/to/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
  load_vae: true
  precision: bfloat16

student:
  hidden_anchor_layers: [1, 3, 5, 7, 9, 12]
  motion_anchor_layers: [6, 8, 10, 12]

distill:
  projection_dim: 256
  hidden_teacher_layers: [1, 4, 8, 14, 20, 30]
  motion_teacher_layers: [11, 17, 23, 30]

pca_prep:
  episodes: 1000
  subclips_per_episode: 4
  states_per_subclip: 2
  max_tokens_per_layer: 200000

artifacts:
  output_dir: /path/to/stage1_pca_artifacts
