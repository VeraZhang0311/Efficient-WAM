# RoboTwin Data Converter Configuration
# Convert the original RoboTwin2.0 dataset into the EfficientWAM training format.

source_root: /path/to/robotwin_raw/dataset
target_root: /path/to/converted_robotwin

fps: 30
target_width: 320
target_height: 360

max_workers: 4
skip_existing: true
enable_qpos_stats: true
qpos_stats_output: /path/to/converted_robotwin/stats/qpos_mean_std.json
qpos_stats_num_workers: 4

demo_type_mapping:
  aloha-agilex_clean_50: clean
  aloha-agilex_randomized_500: randomized

enable_t5_embeddings: true
wan_repo_path: /path/to/Wan2.2-TI2V-5B
t5_max_length: 512
cuda_devices: ["0"]

log_level: INFO
save_debug_frames: false
debug_output_dir: /tmp/robotwin_debug
